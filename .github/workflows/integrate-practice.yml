name: Integrate practice archive

on:
  push:
    paths:
      - '.github/workflows/integrate-practice.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate new images and captions
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = '''<style id="practice-gallery">
          .practice-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:20px}
          .practice-item{margin:0;display:flex;flex-direction:column;gap:10px}
          .practice-item img{width:100%;height:100%;min-height:360px;object-fit:cover;display:block;background:#111}
          .practice-item figcaption{font:9px Arial,sans-serif;letter-spacing:.15em;text-transform:uppercase;line-height:1.55;color:var(--muted)}
          .practice-item:nth-child(1){grid-column:1/8}.practice-item:nth-child(2){grid-column:8/13}
          .practice-item:nth-child(3){grid-column:1/5}.practice-item:nth-child(4){grid-column:5/9}.practice-item:nth-child(5){grid-column:9/13}
          .practice-item:nth-child(6){grid-column:1/7}.practice-item:nth-child(7){grid-column:7/13}
          .practice-item:nth-child(8){grid-column:1/6}.practice-item:nth-child(9){grid-column:6/13}
          .practice-item:nth-child(1) img,.practice-item:nth-child(2) img{height:560px}
          .practice-item:nth-child(6) img,.practice-item:nth-child(7) img{height:500px}
          .practice-item:nth-child(8) img,.practice-item:nth-child(9) img{height:470px}
          @media(max-width:820px){.practice-grid{grid-template-columns:1fr 1fr}.practice-item:nth-child(n){grid-column:auto}.practice-item img,.practice-item:nth-child(n) img{height:360px;min-height:0}}
          @media(max-width:560px){.practice-grid{grid-template-columns:1fr;gap:26px}.practice-item:nth-child(n){grid-column:auto}.practice-item img,.practice-item:nth-child(n) img{height:auto;aspect-ratio:4/5;min-height:0}.practice-item figcaption{font-size:8px}}
          </style>'''
          if 'id="practice-gallery"' not in s:
              s = s.replace('</head>', css + '</head>', 1)

          old = '''<div class="archive"><img src="images/790475827_1034434156288096_7127680628951232570_n.jpg" alt="Archivo de trabajo de Ricardo Traviezo" loading="lazy"><img src="images/792458665_1091734283712632_2583601313196039443_n.jpg" alt="Archivo de trabajo de Ricardo Traviezo" loading="lazy"><img src="images/792667056_1079940268099541_7657291511319108562_n.jpg" alt="Archivo de trabajo de Ricardo Traviezo" loading="lazy"><img src="images/792848799_1327968340395674_3643280475829553383_n.jpg" alt="Archivo de trabajo de Ricardo Traviezo" loading="lazy"><img src="images/792848814_1594981198772483_6583429285655514066_n.jpg" alt="Archivo de trabajo de Ricardo Traviezo" loading="lazy"><img src="images/792999553_1049988904537070_516172116212221821_n.jpg" alt="Archivo de trabajo de Ricardo Traviezo" loading="lazy"><img src="images/794316109_1045628268479731_7772706925578348711_n.jpg" alt="Archivo de trabajo de Ricardo Traviezo" loading="lazy"></div>'''

          new = '''<div class="practice-grid">
          <figure class="practice-item"><img src="images/792584833_1374897071042515_5093555810085772292_n.jpg" alt="Actuación — ¿Y si no hubiera un pequeño lugar para mí en este mundo?" loading="lazy" decoding="async"><figcaption>Actuación · ¿Y si no hubiera un pequeño lugar para mí en este mundo?</figcaption></figure>
          <figure class="practice-item"><img src="images/792704989_1500206828530639_4923806146563506042_n.jpg" alt="Revista Aja — portada" loading="lazy" decoding="async"><figcaption>Revista Aja · Portada</figcaption></figure>
          <figure class="practice-item"><img src="images/792806477_1104361408699171_2334968309669882884_n.jpg" alt="El amor de las luciérnagas — dirección" loading="lazy" decoding="async"><figcaption>El amor de las luciérnagas · Dirección · 2019</figcaption></figure>
          <figure class="practice-item"><img src="images/793436328_1386578663611597_3119122944950862542_n.jpg" alt="Caricias y ausencias — dirección" loading="lazy" decoding="async"><figcaption>Caricias y ausencias · Dirección · 2019</figcaption></figure>
          <figure class="practice-item"><img src="images/793865931_1092598373151622_5036003803613531175_n.jpg" alt="La manera más perversa — dramaturgia" loading="lazy" decoding="async"><figcaption>La manera más perversa · Dramaturgia · 2019</figcaption></figure>
          <figure class="practice-item"><img src="images/808440328_2487447351739604_8988434613881335964_n.jpg" alt="Ricardo Traviezo en proceso de docencia" loading="lazy" decoding="async"><figcaption>Docencia · Trabajo de formación</figcaption></figure>
          <figure class="practice-item"><img src="images/809458413_1740250870378853_2704460770818701167_n.jpg" alt="Ricardo Traviezo con equipo de actores" loading="lazy" decoding="async"><figcaption>Dirección · Proceso con actores</figcaption></figure>
          <figure class="practice-item"><img src="images/810117831_2306788806808258_8227854674532213262_n.jpg" alt="Ricardo Traviezo en la Feria del Libro" loading="lazy" decoding="async"><figcaption>Escritura · Conversación en la Feria del Libro</figcaption></figure>
          <figure class="practice-item"><img src="images/813824857_1366844488544032_4181682933526549762_n.jpg" alt="Ricardo Traviezo firmando DramaLeón" loading="lazy" decoding="async"><figcaption>DramaLeón · Firma de libro</figcaption></figure>
          </div>'''

          if old in s:
              s = s.replace(old, new, 1)
          elif 'class="practice-grid"' not in s:
              marker = '<section id="archivo" class="rule">'
              start = s.find(marker)
              if start != -1:
                  pos = s.find('</h2>', start)
                  if pos != -1:
                      pos += len('</h2>')
                      s = s[:pos] + new + s[pos:]

          # Add Caricias y ausencias to the complete direction trajectory if not already present.
          target = '<li><strong>El amor de las luciérnagas</strong> — dirección. <em>2019.</em></li>'
          addition = target + '<li><strong>Caricias y ausencias</strong> — dirección. <em>2019.</em></li>'
          if 'Caricias y ausencias</strong>' not in s and target in s:
              s = s.replace(target, addition, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Curate practice archive with new work images"
            git push
          fi
