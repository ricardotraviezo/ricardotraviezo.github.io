name: Add stage creation laboratory

on:
  push:
    paths:
      - '.github/workflows/add-stage-creation-lab.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add laboratory offer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              '<div class="cv-label">Escritura · Actuación · Dirección</div>',
              '<div class="cv-label">Escritura · Actuación · Dirección · Creación escénica</div>'
          )

          new_card = '''<article class="service"><span class="wait">Cupo limitado · 10 participantes</span><span class="tag">En línea · Dirección · Creación escénica</span><h3>Laboratorio de Dirección y Creación Escénica</h3><p>Un espacio para convertir una intuición en un proyecto escénico. Partimos de las bases teóricas de la dirección para trabajar mirada, concepto, dramaturgia de la escena, relación con el actor, composición, espacio, imagen, ritmo y construcción de un lenguaje propio. Está dirigido a directores, actores, dramaturgos y creadores que quieran desarrollar una idea o proyecto concreto.</p><div class="price">$1,000 MXN / mes</div><div class="detail">Inicio · primera semana de noviembre de 2026<br>1 sesión grupal semanal · 2 horas · En línea<br>Incluye una asesoría individual de 45 minutos entre semana para desarrollar el proyecto<br>Cupo máximo · 10 participantes</div><a class="button" target="_blank" rel="noopener" href="https://wa.me/528129100157?text=Hola%20Ricardo.%20Quisiera%20apartar%20un%20lugar%20en%20el%20Laboratorio%20de%20Direcci%C3%B3n%20y%20Creaci%C3%B3n%20Esc%C3%A9nica%20en%20l%C3%ADnea.">Apartar lugar →</a></article>'''

          pattern = re.compile(r'<article class="service"><span class="tag">Dirección · Actores · Escena</span><h3>Talleres de Dirección</h3>.*?</article>')
          s, n = pattern.subn(new_card, s, count=1)
          if n != 1:
              raise SystemExit(f'Expected to replace one direction card, replaced {n}')

          # Add rel=noopener to remaining external WhatsApp buttons if missing.
          s = re.sub(r'<a class="button" target="_blank"(?! rel=)', '<a class="button" target="_blank" rel="noopener"', s)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit site update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Launch online direction and stage creation laboratory"
          git push
