name: Finish portfolio site

on:
  push:
    paths:
      - '.github/workflows/site-finish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finish-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install pillow

      - name: Optimize images and finish metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import re

          root = Path('.')
          images = root / 'images'

          def save_web(src, dst, max_width=1800, quality=82):
              im = Image.open(src).convert('RGB')
              if im.width > max_width:
                  h = round(im.height * max_width / im.width)
                  im = im.resize((max_width, h), Image.Resampling.LANCZOS)
              im.save(dst, 'JPEG', quality=quality, optimize=True, progressive=True)
              return Image.open(dst).size

          hero_src = next(images.glob('Foro13_Incendios_Seleccio*n_Color_005.jpg'))
          hero_size = save_web(hero_src, images / 'incendios-hero.jpg', 1800, 82)
          img080_size = save_web(images / 'Foro13_Incendios_EnsayoGeneral_080.jpg', images / 'incendios-080.jpg', 1500, 82)
          img053_size = save_web(images / 'Foro13_Incendios_EnsayoGeneral_053.jpg', images / 'incendios-053.jpg', 1500, 82)

          hero = Image.open(hero_src).convert('RGB')
          og = ImageOps.fit(hero, (1200, 630), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
          og.save(images / 'og-ricardo-traviezo.jpg', 'JPEG', quality=84, optimize=True, progressive=True)

          favicon = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
          <rect width="64" height="64" fill="#eee9df"/>
          <text x="7" y="45" font-family="Georgia, 'Times New Roman', serif" font-size="43" fill="#132634">RT</text>
          </svg>'''
          Path('favicon.svg').write_text(favicon, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
              'images/Foro13_Incendios_Selección_Color_005.jpg': 'images/incendios-hero.jpg',
              'images/Foro13_Incendios_EnsayoGeneral_080.jpg': 'images/incendios-080.jpg',
              'images/Foro13_Incendios_EnsayoGeneral_053.jpg': 'images/incendios-053.jpg',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          # Add dimensions/performance hints to the three key images.
          s = s.replace(
              '<img src="images/incendios-hero.jpg" alt="Incendios — Escena Protocolo">',
              f'<img src="images/incendios-hero.jpg" alt="Incendios — Escena Protocolo" width="{hero_size[0]}" height="{hero_size[1]}" decoding="async" fetchpriority="high">'
          )
          s = s.replace(
              '<img src="images/incendios-080.jpg" alt="Incendios — ensayo general" loading="lazy">',
              f'<img src="images/incendios-080.jpg" alt="Incendios — ensayo general" loading="lazy" decoding="async" width="{img080_size[0]}" height="{img080_size[1]}">'
          )
          s = s.replace(
              '<img src="images/incendios-053.jpg" alt="Incendios — ensayo general" loading="lazy">',
              f'<img src="images/incendios-053.jpg" alt="Incendios — ensayo general" loading="lazy" decoding="async" width="{img053_size[0]}" height="{img053_size[1]}">'
          )

          if 'property="og:title"' not in s:
              meta = '''<link rel="canonical" href="https://ricardotraviezo.github.io/">
          <link rel="icon" href="/favicon.svg" type="image/svg+xml">
          <meta name="theme-color" content="#eee9df">
          <meta property="og:type" content="website">
          <meta property="og:locale" content="es_MX">
          <meta property="og:title" content="Ricardo Traviezo — Director · Actor · Dramaturgo">
          <meta property="og:description" content="Teatro, escritura y procesos de creación entre el texto, el actor y la escena.">
          <meta property="og:url" content="https://ricardotraviezo.github.io/">
          <meta property="og:image" content="https://ricardotraviezo.github.io/images/og-ricardo-traviezo.jpg">
          <meta property="og:image:width" content="1200">
          <meta property="og:image:height" content="630">
          <meta property="og:image:alt" content="Incendios — dirección de Ricardo Traviezo">
          <meta name="twitter:card" content="summary_large_image">
          <meta name="twitter:title" content="Ricardo Traviezo — Director · Actor · Dramaturgo">
          <meta name="twitter:description" content="Teatro, escritura y procesos de creación entre el texto, el actor y la escena.">
          <meta name="twitter:image" content="https://ricardotraviezo.github.io/images/og-ricardo-traviezo.jpg">'''
              s = s.replace('</title>', '</title>' + meta, 1)

          if 'id="mobile-finish"' not in s:
              mobile_css = '''<style id="mobile-finish">
          @media(max-width:560px){
            .wrap{width:92vw}
            nav{height:70px}
            .hero{min-height:72svh;padding:6vh 0 5vh}
            .hero .micro{margin-bottom:12vh}
            .hero h1{font-size:clamp(58px,21vw,96px);line-height:.74;letter-spacing:-.065em;margin-bottom:7vh}
            .hero-statement{font-size:21px;line-height:1.3}
            .hero-actions{margin-top:22px}
            .button{padding:10px 0 8px}
            .stage-image img{height:56svh}
            .stage-caption{font-size:8px;padding-top:10px}
            section{padding:64px 0}
            h2{font-size:clamp(44px,14vw,60px);margin-bottom:40px}
            .obra-intro{margin-bottom:46px}
            .project{grid-template-columns:34px 1fr;padding:25px 0 28px}
            .project h3{font-size:clamp(34px,11vw,46px)}
            .project-role,.project p{grid-column:2}
            .project-feature{margin-top:48px}
            .project-feature img{height:58svh}
            .manifesto{padding:78px 0 90px}
            .manifesto p{font-size:clamp(40px,12vw,58px);line-height:1}
            .bio-selected{margin-top:52px}
            .cv-list li{font-size:16px}
            .service{padding:34px 0 38px}
            .archive{grid-template-columns:1fr}
            .archive img,.archive img:nth-child(n){grid-column:auto;height:68vw;max-height:460px}
            .contact p{font-size:19px}
            footer{flex-direction:column;gap:12px;padding-bottom:36px}
          }
          @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
          </style>'''
              s = s.replace('</head>', mobile_css + '</head>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit finished assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html favicon.svg images/incendios-hero.jpg images/incendios-080.jpg images/incendios-053.jpg images/og-ricardo-traviezo.jpg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Optimize portfolio images and finish social metadata"
            git push
          fi
